<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The REN Experience - Engine & Chart Editor</title>
    <style>
        :root {
            --bg-dark: #07080b;
            --bg-panel: rgba(18, 20, 28, 0.85);
            --text-main: #f0f2f5;
            --text-muted: #8b8f9e;
            --accent-crimson: #ff2e4d;
            --accent-cyan: #00f2fe;
            --accent-purple: #b388ff;
            --accent-gold: #ffbe0b;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --glow-crimson: rgba(255, 46, 77, 0.5);
            --glow-cyan: rgba(0, 242, 254, 0.5);
            --glow-gold: rgba(255, 190, 11, 0.5);
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 46, 77, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 450px;
            height: 750px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 242, 254, 0.05);
            border: 1px solid var(--border-subtle);
        }

        #gameCanvas {
            background: linear-gradient(180deg, #0d0f17 0%, #050608 100%);
            margin: 0 auto;
            display: block;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 8, 11, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        .hidden { display: none !important; }

        h1 { 
            color: var(--text-main); 
            font-size: 28px; 
            text-transform: uppercase; 
            letter-spacing: 5px;
            margin: 0 0 4px 0;
            font-weight: 900;
            text-shadow: 0 0 20px var(--glow-cyan);
            background: linear-gradient(135deg, #fff 0%, #8b8f9e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 { 
            color: var(--accent-cyan); 
            font-size: 13px; 
            margin-bottom: 25px; 
            font-weight: 500; 
            letter-spacing: 3px; 
            text-transform: uppercase;
        }

        .btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            color: var(--text-main);
            border: 1px solid var(--accent-cyan);
            padding: 12px 30px;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            margin: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn:hover { 
            background: var(--accent-cyan); 
            color: var(--bg-dark); 
            box-shadow: 0 0 25px var(--glow-cyan);
            transform: translateY(-2px);
        }

        .btn.danger { border-color: var(--accent-crimson); }
        .btn.danger:hover { 
            background: var(--accent-crimson); 
            color: var(--text-main);
            box-shadow: 0 0 25px var(--glow-crimson);
        }

        .btn.purple { border-color: var(--accent-purple); }
        .btn.purple:hover { 
            background: var(--accent-purple); 
            color: var(--bg-dark);
            box-shadow: 0 0 25px rgba(179, 136, 255, 0.6);
        }

        .song-card {
            border: 1px solid var(--border-subtle);
            padding: 14px 18px;
            margin: 6px 0;
            cursor: pointer;
            width: 300px;
            background: var(--bg-panel);
            transition: all 0.25s ease;
            border-radius: 8px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song-card:hover { 
            border-color: var(--accent-cyan); 
            background: rgba(0, 242, 254, 0.08);
            transform: translateX(3px);
        }

        .song-card h3 { color: var(--text-main); margin: 0 0 4px 0; font-size: 15px; font-weight: 700; }
        .song-card p { margin: 0; color: var(--text-muted); font-size: 11px; letter-spacing: 1px; }

        #pauseBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 5;
            background: rgba(18, 20, 28, 0.6);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 6px 14px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 1.5px;
            font-weight: 700;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        .controls { 
            color: var(--text-muted); 
            font-size: 11px; 
            margin-top: 25px; 
            line-height: 2; 
            letter-spacing: 1.5px;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .controls span { color: var(--accent-cyan); font-weight: 700; }

        #hud { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            pointer-events: none; 
            z-index: 4; 
            text-align: left; 
        }

        #scoreDisplay { font-size: 26px; color: var(--text-main); font-weight: 800; }
        #comboDisplay { font-size: 14px; color: var(--accent-gold); height: 20px; font-weight: 700; text-transform: uppercase; }

        /* Charting Editor HUD overlay */
        #editorOverlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            z-index: 20;
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
        }

        .editor-row { display: flex; justify-content: space-between; align-items: center; }
        textarea#exportArea {
            width: 95%;
            height: 80px;
            background: #000;
            color: var(--accent-cyan);
            border: 1px solid var(--border-subtle);
            font-family: monospace;
            font-size: 10px;
            resize: none;
            margin-top: 5px;
        }
    </style>
</head>
<body>

        <div id="hud" class="hidden">
            <div id="scoreDisplay">0</div>
            <div id="comboDisplay"></div>
        </div>
        <button id="pauseBtn" class="hidden">PAUSE</button>
