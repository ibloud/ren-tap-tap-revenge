name: Lesson CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check lesson syntax
        run: |
          node --check lesson-model.js
          node --check lesson.js
          node --check lesson-midi-model.js
          node --check lesson-midi.js
      - name: Test scheduling, input feedback and import boundaries
        run: node --test tests/*.test.js
